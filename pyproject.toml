[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-nn"
version = "0.1.0"
description = "Rede neural implementada do zero com NumPy — sem PyTorch, sem TensorFlow."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Gabriel", email = "adamgabriel702@users.noreply.github.com" },
]
keywords = [
    "neural-network", "deep-learning", "numpy", "from-scratch",
    "backpropagation", "cnn", "mlp", "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "jupytext>=1.16",
    "build>=1.0",
    "twine>=4.0",
]
viz = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/adamgabriel702/neural-net-from-scratch"
Repository = "https://github.com/adamgabriel702/neural-net-from-scratch"
Issues = "https://github.com/adamgabriel702/neural-net-from-scratch/issues"
Documentation = "https://github.com/adamgabriel702/neural-net-from-scratch#readme"
Changelog = "https://github.com/adamgabriel702/neural-net-from-scratch/releases"

[tool.setuptools.packages.find]
include = ["nn*"]

[tool.setuptools.package-data]
nn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"